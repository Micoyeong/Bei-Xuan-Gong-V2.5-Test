<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>北玄宫 V2.5｜2.5D 神像视差测试</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#120804;color:#f6dfad;font-family:Arial,"PingFang SC",sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden;perspective:1200px;background:#100602}
#scene{position:absolute;inset:-2.5%;transform-style:preserve-3d;will-change:transform}
.layer{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;pointer-events:none;user-select:none}
#back{transform:translateZ(-80px) scale(1.06);filter:saturate(1.04)}
.deity{position:absolute;top:0;height:100%;width:auto;max-width:none;object-fit:contain;filter:drop-shadow(0 13px 12px rgba(0,0,0,.52)) drop-shadow(0 0 10px rgba(255,183,72,.18));will-change:transform;transform-style:preserve-3d}
#fazhu{left:13.7%;height:52%;top:26.5%;transform:translateZ(28px)}
#taizi{left:34.7%;height:58.5%;top:20.5%;transform:translateZ(48px)}
#xuandi{left:62.7%;height:52.5%;top:27%;transform:translateZ(30px)}
#urn{left:39.2%;height:27%;top:70%;transform:translateZ(100px);filter:drop-shadow(0 12px 10px rgba(0,0,0,.55))}
#vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.32) 100%)}
#label{position:absolute;left:18px;top:16px;z-index:5;font-size:13px;letter-spacing:2px;color:#f8d99a;text-shadow:0 2px 6px #000}
#hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);z-index:5;padding:9px 15px;border:1px solid rgba(226,178,94,.45);background:rgba(18,10,5,.7);border-radius:5px;font-size:12px;white-space:nowrap}
@media(max-width:700px){#fazhu{left:8%;height:43%;top:31%}#taizi{left:31%;height:48%;top:24%}#xuandi{left:60%;height:43%;top:31%}#urn{left:37%;height:22%;top:72%}#hint{font-size:10px;bottom:8px}}
</style></head><body>
<div id="stage"><div id="label">北玄宫 · V2.5 立体视差测试</div>
<div id="scene">
<img id="back" class="layer" src="temple-background.jpg">
<img id="fazhu" class="deity" src="deity-fazhu.png">
<img id="taizi" class="deity" src="deity-taizi.png">
<img id="xuandi" class="deity" src="deity-xuandi.png">
<img id="urn" class="layer" src="incense-urn.png">
</div><div id="vignette"></div><div id="hint">移动鼠标或手机倾斜／拖动，体验前后层次</div></div>
<script>
const scene=document.getElementById('scene');
const layers=[
 [document.getElementById('back'),.16],
 [document.getElementById('fazhu'),.48],
 [document.getElementById('taizi'),.7],
 [document.getElementById('xuandi'),.5],
 [document.getElementById('urn'),1]
];
let tx=0,ty=0,rx=0,ry=0;
function move(x,y){tx=(x/innerWidth-.5)*2;ty=(y/innerHeight-.5)*2}
window.addEventListener('pointermove',e=>move(e.clientX,e.clientY));
window.addEventListener('deviceorientation',e=>{if(e.gamma!==null){tx=Math.max(-1,Math.min(1,e.gamma/25));ty=Math.max(-1,Math.min(1,e.beta/35))}},{passive:true});
function frame(){rx+=(tx-rx)*.06;ry+=(ty-ry)*.06;scene.style.transform=`rotateY(${rx*2.2}deg) rotateX(${-ry*1.3}deg)`;
for(const [el,k] of layers){const x=rx*10*k,y=ry*7*k;el.style.translate=`${x}px ${y}px`;}
requestAnimationFrame(frame)}frame();
</script></body></html>
